<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GummyTap - Carteira</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a; color: #f8fafc; padding: 1rem; margin: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 95vh; text-align: center; box-sizing: border-box;
    }
    .card {
      background: #1e293b; padding: 1.2rem; border-radius: 20px; width: 100%; max-width: 360px;
      border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .network-badge {
      background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px dashed #f59e0b;
      padding: 4px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: bold; margin-bottom: 0.8rem;
    }
    .banner { width: 100%; border-radius: 12px; margin-bottom: 0.6rem; }
    h2 { color: #f59e0b; margin: 0.2rem 0; font-size: 1.3rem; }
    p { font-size: 0.85rem; color: #94a3b8; line-height: 1.4; }
    
    .btn {
      background: #f59e0b; color: #000; border: none; padding: 0.9rem; border-radius: 12px;
      font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 0.6rem;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { background: #475569; color: #94a3b8; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    
    .wallet-badge {
      font-size: 0.75rem; background: #0f172a; padding: 0.4rem 0.6rem; border-radius: 6px;
      color: #38bdf8; word-break: break-all; margin-bottom: 0.8rem; border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <!-- TELA 1: ESCANEAR -->
  <div id="stepScan" class="card">
    <div class="network-badge">🟢 SOLANA DEVNET ATIVA</div>
    <img src="/suco_gummy.png" alt="Suco Gummy" class="banner" onerror="this.style.display='none'" />
    <div id="walletDisplay" class="wallet-badge" onclick="copyWalletPubkey()">Carregando nuvem...</div>
    <h2>🍺 Pague o seu Chopp</h2>
    <p>Escaneie o QR Code gerado pela máquina para realizar o pagamento limite.</p>
    
    <button class="btn" id="btnScan" onclick="startScanFlow()">ESCANEAR QR CODE</button>
  </div>

  <!-- TELA 2: CONTROLE DA CHOPEIRA -->
  <div id="stepTapControl" class="card" style="display: none;">
    <h2>🍻 Chopeira Liberada!</h2>
    <p>Você pagou o limite máximo. Sirva-se!</p>
    
    <button id="btnStart" onclick="startTap()" style="background: #4CAF50; color: white; padding: 15px 30px; font-size: 18px; border: none; border-radius: 10px; margin: 10px; width: 100%; font-weight: bold;">
      🟢 INICIAR FLUXO
    </button>
    
    <button id="btnStop" onclick="stopTap()" style="background: #f44336; color: white; padding: 15px 30px; font-size: 18px; border: none; border-radius: 10px; margin: 10px; width: 100%; font-weight: bold;">
      🛑 PARAR E REEMBOLSAR
    </button>
    
    <p id="tapStatus" style="margin-top: 15px; font-weight: bold;"></p>
    
    <button id="btnNewOrder" class="btn btn-secondary" style="display: none;" onclick="resetToScan()">← NOVO PEDIDO</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const connection = new solanaWeb3.Connection("https://api.devnet.solana.com", "confirmed");
    let userKeypair = null;
    let currentReference = null;

    // INICIALIZA A CARTEIRA DA NUVEM
    window.onload = () => {
      if(tg && tg.CloudStorage) {
        tg.CloudStorage.getItem('gummytap_wallet', (err, secretStr) => {
          if (!err && secretStr) {
            userKeypair = solanaWeb3.Keypair.fromSecretKey(Uint8Array.from(JSON.parse(secretStr)));
            updateWalletUI();
          } else {
            userKeypair = solanaWeb3.Keypair.generate();
            tg.CloudStorage.setItem('gummytap_wallet', JSON.stringify(Array.from(userKeypair.secretKey)));
            updateWalletUI();
          }
        });
      } else {
        // Fallback pra teste no navegador normal
        userKeypair = solanaWeb3.Keypair.generate();
        updateWalletUI();
      }
    };

    function updateWalletUI() {
      const pubkeyStr = userKeypair.publicKey.toBase58();
      document.getElementById('walletDisplay').innerText = `💳 ${pubkeyStr.slice(0,6)}...${pubkeyStr.slice(-4)} (Copiar)`;
    }

    function copyWalletPubkey() {
      if (!userKeypair) return;
      navigator.clipboard.writeText(userKeypair.publicKey.toBase58()).then(() => {
        tg?.HapticFeedback?.notificationOccurred('success');
        alert("Carteira copiada!");
      });
    }

    function startScanFlow() {
      if (!userKeypair) return alert("Aguarde a carteira carregar!");
      
      if (tg && typeof tg.showScanQrPopup === 'function') {
        tg.showScanQrPopup({ text: "Aponte para o QR Code" }, (qrText) => {
          tg.closeScanQrPopup();
          processPayment(qrText);
          return true;
        });
      } else {
        const mock = prompt("Modo Teste: Cole a URL Solana Pay:");
        if (mock) processPayment(mock);
      }
    }

    async function processPayment(qrData) {
      tg?.HapticFeedback?.impactOccurred('medium');
      const btn = document.getElementById('btnScan');
      btn.disabled = true;
      btn.innerText = "Processando pagamento...";

      try {
        // Extrai a reference da URL
        let cleanData = qrData.trim();
        if (cleanData.startsWith("solana:")) {
          cleanData = cleanData.replace("solana:", "");
        }
        const session = await ensureReferenceReady();
  
  // FORÇA EXIBIR O VALOR NA TELA PARA VOCÊ VER
  document.getElementById('tapStatus').innerText = `Debug - Ref: ${currentReference} | Session: ${JSON.stringify(session)}`;
  document.getElementById('tapStatus').style.color = "#38bdf8";
  await new Promise(r => setTimeout(r, 4000)); // Espera 4 segundos para você ler na tela do celular
        // Se for uma URL completa, extrai a reference via URLSearchParams
        if (cleanData.includes("?")) {
          let urlObj = new URL(cleanData);
          currentReference = urlObj.searchParams.get("reference");
        } else {
  // Se for apenas o link bruto do servidor
  let parts = cleanData.split("reference=");
  currentReference = parts[1] ? parts[1].split("&")[0] : null;
}

        const res = await fetch('/api/process-solana-pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ qrData: qrData, customerPubkey: userKeypair.publicKey.toBase58() })
        });
        
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        btn.innerText = "Assinando transação...";
        const tx = solanaWeb3.Transaction.from(Uint8Array.from(atob(data.transactionBase64), c => c.charCodeAt(0)));
        tx.partialSign(userKeypair);

        const rawTx = tx.serialize();
        const txSig = await connection.sendRawTransaction(rawTx);
        
        btn.innerText = "Aguardando rede...";
        await connection.confirmTransaction(txSig, "confirmed");

        tg?.HapticFeedback?.notificationOccurred('success');
        
        // MUDANÇA DE TELA APÓS PAGAR!
        document.getElementById('stepScan').style.display = 'none';
        document.getElementById('stepTapControl').style.display = 'block';

      } catch (err) {
        console.error(err);
        tg?.HapticFeedback?.notificationOccurred('error');
        alert("Falha no pagamento: " + (err.message || err));
      } finally {
        btn.disabled = false;
        btn.innerText = "ESCANEAR QR CODE";
      }
    }

    // --- CONTROLES DA CHOPEIRA ---

  async function ensureReferenceReady(maxRetries = 2, delayMs = 500) {
  for (let i = 0; i < maxRetries; i++) {
    if (currentReference && userKeypair) {
      return { reference: currentReference, pubkey: userKeypair.publicKey.toBase58() };
    }
    // Aguarda um pouco antes de tentar de novo
    await new Promise(resolve => setTimeout(resolve, delayMs));
  }
  return null;
}

async function startTap() {
  const statusEl = document.getElementById('tapStatus');
  statusEl.innerText = "Aguardando sincronização dos dados...";
  statusEl.style.color = "#f59e0b";
  tg?.HapticFeedback?.impactOccurred('light');

  try {
    // Tenta aguardar as variáveis estarem prontas por até 2.5 segundos
    const session = await ensureReferenceReady();
    
    if (!session || !session.reference) {
      throw new Error("Dados da sessão perdidos (referência nula). Escaneie o QR Code novamente.");
    }

    statusEl.innerText = "Iniciando...";
    statusEl.style.color = "#4CAF50";

    const res = await fetch('/api/start-tap', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reference: session.reference })
    });

    const textResponse = await res.text();
    let data;
    try {
      data = JSON.parse(textResponse);
    } catch (e) {
      // Se não for JSON, mostra o texto cru retornado pelo servidor (ex: erro HTML do Python/Flask)
      throw new Error(`Servidor retornou resposta inválida (${res.status}): ${textResponse.slice(0, 100)}`);
    }

    if (!res.ok || !data.success) {
      throw new Error(data.error || `Erro HTTP ${res.status} ao iniciar.`);
    }
    
    statusEl.innerText = "Válvula aberta! Enchendo copo...";
  } catch (err) {
    // Exibe o erro detalhado na tela e loga no console (F12)
    statusEl.innerText = "Erro ao iniciar: " + err.message;
    statusEl.style.color = "#f44336";
    console.error("Detalhes do erro em startTap:", err);
  }
}

async function stopTap() {
  const statusEl = document.getElementById('tapStatus');
  statusEl.innerText = "Verificando sessão para reembolso...";
  statusEl.style.color = "#f59e0b";
  tg?.HapticFeedback?.impactOccurred('heavy');
  
  try {
    const session = await ensureReferenceReady();

    if (!session || !session.reference || !session.pubkey) {
      throw new Error("Dados da sessão ou carteira perdidos. Recomece o pedido.");
    }

    statusEl.innerText = "Parando e calculando reembolso...";

    const res = await fetch('/api/stop-tap', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        reference: session.reference,
        customerPubkey: session.pubkey
      })
    });

    const textResponse = await res.text();
    let data;
    try {
      data = JSON.parse(textResponse);
    } catch (e) {
      throw new Error(`Servidor retornou resposta inválida (${res.status}): ${textResponse.slice(0, 100)}`);
    }

    if (!res.ok || !data.success) {
      throw new Error(data.error || `Erro HTTP ${res.status} ao reembolsar.`);
    }
    
    statusEl.innerText = `Sucesso! Reembolso processado.`;
    statusEl.style.color = "#4CAF50";
    
    document.getElementById('btnStart').style.display = 'none';
    document.getElementById('btnStop').style.display = 'none';
    document.getElementById('btnNewOrder').style.display = 'block';
    
  } catch (err) {
    // Exibe o erro detalhado na tela e loga no console (F12)
    statusEl.innerText = "Erro no reembolso: " + err.message;
    statusEl.style.color = "#f44336";
    console.error("Detalhes do erro em stopTap:", err);
  }
}
  </script>
</body>
</html>
