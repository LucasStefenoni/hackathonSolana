<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GummyTap - Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a; color: #f8fafc; padding: 1rem; margin: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 95vh; text-align: center; box-sizing: border-box;
    }
    .card {
      background: #1e293b; padding: 1.2rem; border-radius: 20px; width: 100%; max-width: 360px;
      border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .network-badge {
      background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px dashed #f59e0b;
      padding: 4px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: bold; margin-bottom: 0.8rem;
    }
    h2 { color: #f59e0b; margin: 0.2rem 0; font-size: 1.3rem; }
    p { font-size: 0.85rem; color: #94a3b8; line-height: 1.4; }
    
    .btn {
      background: #f59e0b; color: #000; border: none; padding: 0.9rem; border-radius: 12px;
      font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 0.6rem;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    
    .wallet-badge {
      font-size: 0.75rem; background: #0f172a; padding: 0.4rem 0.6rem; border-radius: 6px;
      color: #38bdf8; word-break: break-all; margin-bottom: 0.8rem; border: 1px solid #334155; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- TELA 1: ESCANEAR -->
  <div id="stepScan" class="card">
    <div class="network-badge">🟢 SOLANA DEVNET ATIVA</div>
    <div id="walletDisplay" class="wallet-badge" onclick="copyWalletPubkey()">Carregando nuvem...</div>
    <h2>🍺 Pague o seu Chopp</h2>
    <p>Escaneie o QR Code gerado pela máquina para realizar o pagamento limite.</p>
    
    <button class="btn" id="btnScan" onclick="startScanFlow()">ESCANEAR QR CODE</button>
  </div>

  <!-- TELA 2: CONTROLE DA CHOPEIRA -->
  <div id="stepTapControl" class="card" style="display: none;">
    <h2>🍻 Pedido Concluído!</h2>
    <p id="tapStatus" style="margin-top: 15px; font-weight: bold; color: #4CAF50;">Pagamento confirmado e processado com sucesso.</p>
    
    <button id="btnNewOrder" class="btn btn-secondary" style="margin-top: 20px;" onclick="resetToScan()">← NOVO PEDIDO</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const connection = new solanaWeb3.Connection("https://api.devnet.solana.com", "confirmed");
    let userKeypair = null;
    let currentReference = null;

    // INICIALIZA A CARTEIRA DA NUVEM DO TELEGRAM
    window.onload = () => {
      if (tg && tg.CloudStorage) {
        tg.CloudStorage.getItem('gummytap_wallet', (err, secretStr) => {
          if (!err && secretStr) {
            try {
              userKeypair = solanaWeb3.Keypair.fromSecretKey(Uint8Array.from(JSON.parse(secretStr)));
              updateWalletUI();
              return;
            } catch (e) {
              console.error("Erro ao parsear chave da nuvem, gerando nova...", e);
            }
          }
          generateAndStoreCloudWallet();
        });
      } else {
        userKeypair = solanaWeb3.Keypair.generate();
        updateWalletUI();
      }
    };

    function generateAndStoreCloudWallet() {
      userKeypair = solanaWeb3.Keypair.generate();
      if (tg && tg.CloudStorage) {
        tg.CloudStorage.setItem('gummytap_wallet', JSON.stringify(Array.from(userKeypair.secretKey)), (err) => {
          if (err) console.error("Erro ao salvar na nuvem do Telegram:", err);
        });
      }
      updateWalletUI();
    }

    function updateWalletUI() {
      if (!userKeypair) return;
      const pubkeyStr = userKeypair.publicKey.toBase58();
      document.getElementById('walletDisplay').innerText = `💳 ${pubkeyStr.slice(0,6)}...${pubkeyStr.slice(-4)} (Copiar)`;
    }

    function copyWalletPubkey() {
      if (!userKeypair) return;
      navigator.clipboard.writeText(userKeypair.publicKey.toBase58()).then(() => {
        tg?.HapticFeedback?.notificationOccurred('success');
      });
    }

    function startScanFlow() {
      if (!userKeypair) return;
      
      if (tg && typeof tg.showScanQrPopup === 'function') {
        tg.showScanQrPopup({ text: "Aponte para o QR Code" }, (qrText) => {
          tg.closeScanQrPopup();
          processPayment(qrText);
          return true;
        });
      } else {
        const mock = prompt("Modo Teste: Cole a URL Solana Pay ou referência:");
        if (mock) processPayment(mock);
      }
    }

    async function processPayment(qrData) {
      if (!userKeypair) return;
      
      const btn = document.getElementById('btnScan');
      btn.disabled = true;
      btn.innerText = "Processando...";

      try {
        let cleanData = qrData ? qrData.trim() : "";
        if (cleanData.startsWith("solana:")) {
          cleanData = decodeURIComponent(cleanData.replace("solana:", ""));
        }

        const urlObj = new URL(cleanData.startsWith("http") ? cleanData : `https://dummy-base.com/${cleanData}`);
        currentReference = urlObj.searchParams.get("reference") || cleanData;

        if (!currentReference) throw new Error("Referência inválida.");

        const res = await fetch(`/api/pay?reference=${encodeURIComponent(currentReference)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account: userKeypair.publicKey.toBase58() })
        });
        
        const responseText = await res.text();
        if (!res.ok) throw new Error(responseText);

        const data = JSON.parse(responseText);
        if (!data.transaction) throw new Error(data.error || "Erro ao gerar transação.");

        btn.innerText = "Assinando...";
        const tx = solanaWeb3.Transaction.from(Uint8Array.from(atob(data.transaction), c => c.charCodeAt(0)));
        tx.partialSign(userKeypair);

        const rawTx = tx.serialize();
        const txSig = await connection.sendRawTransaction(rawTx);
        
        btn.innerText = "Confirmando...";
        await connection.confirmTransaction(txSig, "confirmed");

        tg?.HapticFeedback?.notificationOccurred('success');
        
        document.getElementById('stepScan').style.display = 'none';
        document.getElementById('stepTapControl').style.display = 'block';
        document.getElementById('tapStatus').innerText = "Pagamento confirmado e contrato iniciado com sucesso!";

      } catch (err) {
        tg?.HapticFeedback?.notificationOccurred('error');
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.innerText = "ESCANEAR QR CODE";
      }
    }

    function resetToScan() {
      document.getElementById('stepTapControl').style.display = 'none';
      document.getElementById('stepScan').style.display = 'block';
      document.getElementById('tapStatus').innerText = '';
      currentReference = null;
    }
  </script>
</body>
</html>
